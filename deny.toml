# cargo-deny policy. CI runs `cargo deny check`.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Nothing here may execute a shell; the runner uses argv only.
deny = [{ name = "shell-words" }, { name = "subprocess" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
