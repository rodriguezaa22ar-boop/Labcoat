name: fuzz

# Coverage-guided fuzzing (libFuzzer via cargo-fuzz) of every parser that
# reads untrusted bytes. The same targets run without instrumentation in
# every `cargo test` (crates/lcoat-fuzz); this job adds coverage guidance.
# Short on every push, long every night; a crash fails the job and its
# input is uploaded as an artifact.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "seconds per target"
        default: "300"

permissions:
  contents: read

jobs:
  libfuzzer:
    name: cargo-fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - nmap_xml
          - nmap_args
          - script_args
          - json
          - ndjson
          - ledger_chain
          - envfile
          - metadata_scan
          - timestamp
          - expiry
          - slug
          - packet_text
          - receipt
          - op_files
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      # A pinned version, so rust-cache's cached ~/.cargo/bin is reused
      # instead of rebuilding cargo-fuzz whenever a new release appears.
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      # The harness resolves exactly the committed fuzz/Cargo.lock.
      - name: fuzz lockfile is current
        run: cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml >/dev/null
      # The corpus each target has grown so far (saved by main and the
      # nightly run below; pull requests restore it but do not save).
      - name: restore grown corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: seed corpus
        run: cargo run --quiet -p lcoat-fuzz -- seeds ${{ matrix.target }} fuzz/corpus
      - name: fuzz
        env:
          SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && '600' || github.event.inputs.seconds || '45' }}
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} -- \
            -max_total_time="$SECONDS_PER_TARGET" -max_len=65536 -timeout=10 -rss_limit_mb=2048
      # Merge into a minimal set before saving, so the cache stays small.
      - name: minimize corpus
        if: success() && github.event_name != 'pull_request'
        run: cargo +nightly fuzz cmin ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} -- -max_len=65536 -timeout=10
      - name: save grown corpus
        if: success() && github.event_name != 'pull_request'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
